services:
  finance-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.12-slim}
    image: ai-finance-os:phone-auth
    container_name: finance-app
    ports:
      - "127.0.0.1:18081:8080"
    environment:
      APP_ENV: ${APP_ENV:-development}
      HOST: 0.0.0.0
      PORT: "8080"
      DATABASE_URL: postgresql+psycopg://finance:${POSTGRES_PASSWORD:-finance-local-only}@finance-postgres:5432/finance
      REDIS_URL: redis://finance-redis:6379/0
      UPLOAD_DIR: /app/data/uploads
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-development-only-change-me}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://127.0.0.1:18081}
      PRODUCTION_ORIGIN: https://finance.chiraliumai.cn
      REFRESH_TOKEN_EXPIRE_DAYS: "30"
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      SMS_ACCESS_KEY: ${SMS_ACCESS_KEY:-}
      SMS_SECRET_KEY: ${SMS_SECRET_KEY:-}
      SMS_SIGN_NAME: ${SMS_SIGN_NAME:-}
      SMS_TEMPLATE_CODE: ${SMS_TEMPLATE_CODE:-}
      SMS_TEMPLATE_CODE_LOGIN: ${SMS_TEMPLATE_CODE_LOGIN:-}
      SMS_REMOTE_ENABLED: ${SMS_REMOTE_ENABLED:-false}
      SMS_DEV_FORCE_LOCAL: ${SMS_DEV_FORCE_LOCAL:-true}
      SMS_DEV_EXPOSE_CODE: ${SMS_DEV_EXPOSE_CODE:-false}
      SMS_CODE_EXPIRE_SECONDS: ${SMS_CODE_EXPIRE_SECONDS:-300}
      SMS_COOLDOWN_SECONDS: ${SMS_COOLDOWN_SECONDS:-60}
      SMS_CODE_PEPPER: ${SMS_CODE_PEPPER:-development-only-sms-pepper}
      SMS_GLOBAL_DAY_LIMIT: ${SMS_GLOBAL_DAY_LIMIT:-500}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      DEMO_SEED_NEW_USERS: ${DEMO_SEED_NEW_USERS:-true}
      AI_PROVIDER: ${AI_PROVIDER:-demo}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - finance-uploads:/app/data/uploads
    depends_on:
      finance-postgres:
        condition: service_healthy
      finance-redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).read()",
        ]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 8

  finance-postgres:
    image: postgres:16-alpine
    container_name: finance-postgres
    environment:
      POSTGRES_DB: finance
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finance-local-only}
    volumes:
      - finance-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d finance"]
      interval: 5s
      timeout: 3s
      retries: 12

  finance-redis:
    image: redis:7-alpine
    container_name: finance-redis
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - finance-redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  finance-postgres-data:
  finance-redis-data:
  finance-uploads:
