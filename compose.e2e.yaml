name: ai-finance-os-e2e

services:
  finance-app-e2e:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.12-slim}
    image: ai-finance-os:e2e
    ports:
      - "127.0.0.1:18082:8080"
    environment:
      APP_ENV: test
      HOST: 0.0.0.0
      PORT: "8080"
      DATABASE_URL: postgresql+psycopg://finance:finance-e2e-only@finance-postgres-e2e:5432/finance
      REDIS_URL: redis://finance-redis-e2e:6379/0
      UPLOAD_DIR: /app/data/uploads
      JWT_SECRET_KEY: e2e-only-jwt-secret-that-is-long-enough
      COOKIE_SECURE: "false"
      FRONTEND_ORIGIN: http://127.0.0.1:18082
      SMS_REMOTE_ENABLED: "false"
      SMS_DEV_FORCE_LOCAL: "true"
      SMS_DEV_EXPOSE_CODE: "true"
      SMS_TEST_CODE: "123456"
      SMS_CODE_PEPPER: e2e-only-sms-code-pepper
      TURNSTILE_SITE_KEY: ""
      TURNSTILE_SECRET_KEY: ""
      DEMO_SEED_NEW_USERS: "true"
    volumes:
      - finance-e2e-uploads:/app/data/uploads
    depends_on:
      finance-postgres-e2e:
        condition: service_healthy
      finance-redis-e2e:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).read()",
        ]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12

  finance-postgres-e2e:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: finance
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance-e2e-only
    volumes:
      - finance-e2e-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d finance"]
      interval: 3s
      timeout: 3s
      retries: 20

  finance-redis-e2e:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - finance-e2e-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  finance-e2e-postgres:
  finance-e2e-redis:
  finance-e2e-uploads:
